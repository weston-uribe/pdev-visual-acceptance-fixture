<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inspect panel</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <p><a href="/review">Back to review</a></p>
      <h1>Inspect panel</h1>
    </header>
    <main>
      <div class="card">
        <p class="hint">
          Read the value from the rendered panel. It is not repeated in this
          page.
        </p>
        <img
          class="panel"
          src="/assets/panel.png"
          width="160"
          height="48"
          alt=""
          aria-hidden="true"
        />
        <a class="button" href="/confirm">Confirm quote</a>
      </div>
    </main>
  </body>
</html>
